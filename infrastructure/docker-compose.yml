services:
  ubuntu_victim:
    build: 
      context: .
      dockerfile: victim.DockerFile
    container_name: ubuntu_victim
    networks:
      - quadshield_net
    volumes:
      # Exposes container logs safely to your VS Code workspace
      - ./shared_logs:/var/log

  kali_attacker:
    build: 
      context: .
      dockerfile: attacker.DockerFile
    container_name: kali_attacker
    networks:
      - quadshield_net
    depends_on:
      - ubuntu_victim

  # --- NEW: QuadShield Data Streaming Pipeline ---

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - quadshield_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      # Exposes Kafka to your Windows host machine
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Configures the dual-listener setup for internal and external traffic
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    networks:
      - quadshield_net

networks:
  quadshield_net:
    driver: bridge